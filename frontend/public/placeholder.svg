<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .ph-bg { fill: #f1f5f9; }
    .ph-icon { stroke: #94a3b8; }
    .ph-text-main { fill: #64748b; }
    .ph-text-sub { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .ph-bg { fill: #111c2e; }
      .ph-icon { stroke: #475569; }
      .ph-text-main { fill: #94a3b8; }
      .ph-text-sub { fill: #64748b; }
    }
  </style>
  <rect width="400" height="300" class="ph-bg"/>
  <g fill="none" class="ph-icon" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(160, 95)">
    <rect x="3" y="3" width="74" height="74" rx="10"/>
    <circle cx="28" cy="28" r="7"/>
    <path d="m73 57-22-22-38 38"/>
  </g>
  <text x="200" y="210" class="ph-text-main" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">No image available</text>
  <text x="200" y="230" class="ph-text-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Marketplace Catalog</text>
</svg>
